[package]
name = "kvproto"
version = "0.0.2"
keywords = ["TiKV"]
edition = "2021"
build = "build.rs"

[lib]
name = "kvproto"
path = "src/lib.rs"

[features]
default = ["protobuf-codec"]
protobuf-codec = ["protobuf-build/protobuf-codec", "raft-proto/protobuf-codec"]
prost-codec = ["prost", "prost-derive", "lazy_static", "raft-proto/prost-codec"]
grpcio-protobuf = ["protobuf-codec", "protobuf-build/grpcio-protobuf-codec", "grpcio/protobuf-codec"]
grpcio-prost = ["prost-codec", "grpcio", "protobuf-build/grpcio-prost-codec", "grpcio/prost-codec"]
tonic-prost = ["prost-codec", "dep:tonic", "protobuf-build/tonic-prost-codec"]
tonic-protobuf = [ "dep:tonic", "dep:tonic-codec-protobuf", "protobuf-codec" ]

[dependencies]
protobuf = "=2.8.0"
prost = { version = "0.12", optional = true }
prost-derive = { version = "0.12", optional = true }
futures = "0.3.5"
lazy_static = { version = "1.3", optional = true }
#tonic = {version = "0.11", optional = true}
tonic = { git = "https://github.com/glorv/tonic", branch = "patch-health", optional = true }
tonic-codec-protobuf = { git = "https://github.com/glorv/tonic-protobuf", branch = "build-v2", default-features = false, features = ["protobuf-v2"], optional = true }

# Use wildcard for crates whose version are less than 1.0.0 and are updated
# frequently. So that we do not have to update twice in TiKV and in kvproto.
# And we need to keep Cargo.lock in track, so CI can choose a correct version.
#
# See https://doc.rust-lang.org/cargo/reference/resolver.html#semver-compatibility
raft-proto = { git = "https://github.com/glorv/raft-rs", branch = "prost", default-features = false }
grpcio = { git="https://github.com/glorv/grpc-rs", branch = "prost", default-features = false, optional = true }
[build-dependencies]
# protobuf-build = { version = "0.*", default-features = false }
protobuf-build = { git = "https://github.com/glorv/protobuf-build", branch = "tonic", default-features = false }
tonic-build-protobuf = { git = "https://github.com/glorv/tonic-protobuf", branch = "build-v2", default-features = false, features = ["protobuf-v2"]  }

[patch.crates-io]
# raft-proto = { git = "https://github.com/tikv/raft-rs", rev="95c532612ee6a83591fce9a8b51d6afe87b58835"}
protobuf-codegen = { git = "https://github.com/pingcap/rust-protobuf", rev="82b49fea7e696fd647b5aca0a6c6ec944eab3189" }
protobuf = { git = "https://github.com/pingcap/rust-protobuf", rev="82b49fea7e696fd647b5aca0a6c6ec944eab3189" }
